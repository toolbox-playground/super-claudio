<div id="root">

<script>
const WORDS = window.WORDS;
const DUR = window.DURATION || WORDS[WORDS.length - 1].endMs / 1000 + .6;
window.DURATION = DUR;
const TRANS = .4;
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (t, a, b) => { const x = clamp((t - a) / (b - a)); return 1 - Math.pow(1 - x, 3); };
const inout = (t, a, b) => { const x = clamp((t - a) / (b - a)); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const lerp = (a, b, k) => a + (b - a) * k;
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const norm = (s) => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '');
function at(word, nth = 1) {
  const hits = WORDS.filter((w) => norm(w.word) === norm(word));
  if (hits.length < nth) { console.error(`palavra não encontrada: ${word} #${nth}`); return 0; }
  return hits[nth - 1].startMs / 1000;
}
const typed = (s, t, a, cps = 30) => s.slice(0, Math.max(0, Math.floor((t - a) * cps)));
function show(el, t, a, dist = 30, dur = .45) { const k = ease(t, a, a + dur); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dist}px)`; return k; }
function pop(el, t, a, base = '') { const k = ease(t, a, a + .4); el.style.opacity = k; el.style.transform = `${base} scale(${.8 + .2 * k})`; return k; }
function fade(el, t, a, b = Infinity) { const k = ease(t, a, a + .35) * (b === Infinity ? 1 : 1 - ease(t, b, b + .3)); el.style.opacity = k; return k; }
function ring(el, t, a, b = Infinity, c = '74,222,128') {
  const on = ease(t, a, a + .35) * (b === Infinity ? 1 : 1 - ease(t, b, b + .25));
  el.style.boxShadow = on ? `0 0 0 ${6 * on}px rgba(${c},${on}), 0 0 ${44 * on}px rgba(${c},${.55 * on})` : '0 30px 70px -20px #000';
}
function camera(cam, t, keys, dur = .9) {
  const inn = cam.firstElementChild, W = cam.clientWidth, H = cam.clientHeight;
  const Wi = W, Hi = W / +cam.dataset.ar;
  inn.style.width = Wi + 'px'; inn.style.height = Hi + 'px';
  let r = keys[0][1];
  for (let i = 1; i < keys.length; i++) {
    const [ti, ri] = keys[i]; if (t < ti) break;
    const k = inout(t, ti, ti + dur);
    r = {x: lerp(r.x, ri.x, k), y: lerp(r.y, ri.y, k), w: lerp(r.w, ri.w, k), h: lerp(r.h, ri.h, k)};
  }
  const s = Math.max(W / (r.w * Wi), H / (r.h * Hi));
  const tx = W / 2 - (r.x + r.w / 2) * Wi * s, ty = H / 2 - (r.y + r.h / 2) * Hi * s;
  inn.style.transform = `translate(${tx}px,${ty}px) scale(${s})`;
}
function travel(el, t, a, d, x1, y1, x2, y2, half = 17) {
  const k = inout(t, a, a + d), vis = t >= a && t <= a + d + .15;
  el.style.opacity = vis ? 1 : 0;
  el.style.left = lerp(x1, x2, k) - half + 'px'; el.style.top = lerp(y1, y2, k) - half + 'px';
}
const camHTML = (id, src, ar, style) => `<div class="cam" id="${id}" data-ar="${ar}" style="${style}"><div class="cam-in"><img src="assets/${src}"></div></div>`;
const logo = (id, src, style) => `<div class="logo" id="${id}" style="${style}"><img src="assets/${src}"></div>`;
const page = (kick, title, body, credit = '') => `<div class="kick">${kick}</div><h1>${title}</h1><div class="stage">${body}</div><div class="credit">${credit}</div>`;
const win = (id, title, body, style, cls = '') => `<div class="win ${cls}" id="${id}" style="${style}"><div class="bar"><i></i><i></i><i></i><span>${title}</span></div>${body}</div>`;
const lines = (arr) => arr.map((l, i) => `<span class="ln" data-i="${i}">${l || ' '}</span>`).join('');
